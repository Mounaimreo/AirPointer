name: Build febe75e AirPointer APK

on:
  push:
    branches: [build-febe75e]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output gradle.zip
          unzip -q gradle.zip

      - name: Assemble and build APK
        run: |
          mkdir -p app/src/main/java/ai/mounaim/airpointer
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AirPointer'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'ai.mounaim.airpointer'
            compileSdk 35
            defaultConfig {
              applicationId 'ai.mounaim.airpointer'
              minSdk 26
              targetSdk 35
              versionCode 1
              versionName '1.0.0-febe75e'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application android:label="AirPointer" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/ai/mounaim/airpointer/MainActivity.kt <<'EOF'
          package ai.mounaim.airpointer

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
            }
          }
          EOF

          ./gradle-8.9/bin/gradle clean assembleDebug --stacktrace --no-daemon

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AirPointer-febe75e.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPointer-febe75e
          path: AirPointer-febe75e.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airpointer-febe75e
          name: AirPointer febe75e
          body: Built from commit febe75efc10a978587dd0cac4bfe2ffd9bf84e04
          files: AirPointer-febe75e.apk
          prerelease: false
          make_latest: false
