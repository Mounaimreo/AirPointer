
# كود الربط السحابي التلقائي الشامل والبناء المباشر لـ APK (AirPointer Cloud Workflow)

**المشروع:** AirPointer (مؤشر سطح المكتب بالهواء)  
**المطور:** MOUNAIM IA  
**المسار في GitHub:** `.github/workflows/build-apk.yml`

---

## 1. كود ملف البناء السحابي مع محرك الذكاء الاصطناعي وتتبع السبابة (جاهز للنسخ المباشر)

```yaml
name: AirPointer AI Cloud Build & Direct APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Standalone AI APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 2. Initialize and Assemble AirPointer APK
        run: |
          mkdir -p app/src/main/java/ai/mounaim/airpointer
          mkdir -p app/src/main/res/values
          
          # Gradle Wrapper Setup
          gradle wrapper
          
          # Settings Gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "AirPointer"
          include ':app'
          EOF

          # Root Build Gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # App Build Gradle with AI MediaPipe & CameraX
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'ai.mounaim.airpointer'
              compileSdk 34
              defaultConfig {
                  applicationId "ai.mounaim.airpointer"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.mediapipe:tasks-vision:0.10.14'
              implementation 'androidx.camera:camera-core:1.3.2'
              implementation 'androidx.camera:camera-camera2:1.3.2'
              implementation 'androidx.camera:camera-lifecycle:1.3.2'
          }
          EOF

          # Android Manifest with Overlay, Camera & Accessibility
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ai.mounaim.airpointer">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="AirPointer" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Main Activity Entrypoint
          cat << 'EOF' > app/src/main/java/ai/mounaim/airpointer/MainActivity.kt
          package ai.mounaim.airpointer
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          # Make gradlew executable and build debug APK
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 3. Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPointer-v1.0.0-Universal
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 4. Create Direct GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "AirPointer v1.0.0 Official Release (By MOUNAIM IA)"
          body: "حزمة التثبيت المباشرة لتطبيق مؤشر الهواء لسطح المكتب على الهاتف بنظام تتبع السبابة AI."
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

