name: Build and Release AirPointer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and generate Gradle wrapper
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.2.2-bin.zip \
            --output /tmp/gradle-8.2.2.zip
          unzip -q /tmp/gradle-8.2.2.zip -d /tmp
          /tmp/gradle-8.2.2/bin/gradle wrapper --gradle-version 8.2.2

      - name: Download hand tracker model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task \
            --output app/src/main/assets/hand_landmarker.task

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Copy downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AirPointer-v1.1.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPointer-v1.1.0
          path: AirPointer-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete airpointer-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create airpointer-latest AirPointer-v1.1.0.apk \
            --title "AirPointer v1.1.0" \
            --notes "أحدث نسخة من تطبيق AirPointer — تتبع الإصبع والمؤشر والنقر الجوي" \
            --prerelease
